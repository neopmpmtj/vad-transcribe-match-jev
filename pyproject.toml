[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vad"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.5",
    "openai==3.60.0",
    "sounddevice==0.5.6",
    "typesafe-sdk==0.7.6",
]

[tool.setuptools.packages.find]
where = ["src"]
